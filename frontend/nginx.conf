# frontend/nginx.conf
#
# Sirve el build estatico de Vite. try_files hace fallback a
# index.html para que las rutas de react-router (ej. /startups,
# /technologies) funcionen al recargar la pagina o entrar directo por
# URL — sin esto, Nginx buscaria un archivo /startups que no existe y
# devolveria 404.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
