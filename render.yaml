  # ---------- Gateway ----------
  - name: gateway
    type: web
    runtime: docker
    dockerfilePath: gateway/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /status
    # Sin envVars: gateway/nginx.render.conf tiene las URLs de los 9
    # microservicios escritas directo (ver comentario arriba) — el
    # gateway no lee variables de entorno en absoluto.
