# gateway/nginx.render.conf
#
# Variante de nginx.conf especifica para el despliegue en Render
# (docs/DECISIONES.md) — NO se usa en docker-compose.yml, ese sigue
# usando nginx.conf sin cambios.
#
# Por que existe un archivo aparte: los 9 microservicios y el gateway
# quedaron como "web services" gratuitos en Render (pserv de pago no
# se justificaba solo para este proyecto de evaluacion). Un web
# service gratuito de Render puede ENVIAR trafico por la red privada,
# pero no puede RECIBIRLO — asi que el gateway no puede alcanzar a los
# 9 microservicios por su hostname interno (que es como funciona en
# docker-compose.yml). Aqui cada upstream es la URL publica real de
# cada servicio en Render.
#
# Incidente real (2026-09-04): los 9 nombres "limpios" ya estaban
# tomados por otros usuarios de Render — los 9 servicios quedaron con
# un sufijo (ej. read-technology-service-ztgl, no read-technology-
# service). Este archivo se escribio originalmente con los nombres sin
# sufijo, lo que hizo que el gateway le pegara al servicio de OTRO
# dueno con el mismo nombre base — que ademas estaba suspendido, asi
# que el sintoma fue un 502/503 dificil de diagnosticar sin mirar el
# dashboard de Render. Corregido pegando la URL real de cada uno de
# los 9 servicios (ver docs/DECISIONES.md). Si se recrea cualquiera de
# estos 9 servicios en Render, hay que volver a verificar su URL real
# en el dashboard antes de asumir que el nombre limpio sigue libre.

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;

    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # SNI correcto al hablarle a un host HTTPS por nombre (Render aloja
    # muchos servicios detras de la misma infraestructura compartida).
    proxy_ssl_server_name on;

    # Sin esto, el header Host que le llega a cada microservicio es el
    # del propio gateway, no el del destino real — nginx no reescribe
    # Host por defecto al hacer proxy_pass. $proxy_host toma el host
    # tal cual aparece en la URL de proxy_pass de cada location (el
    # *.onrender.com correspondiente), asi Render puede enrutar bien
    # internamente. nginx -t no detecta este tipo de error porque es
    # valido sintacticamente, solo se nota en runtime.
    proxy_set_header Host $proxy_host;

    # --- Startups ---
    # Hostnames = URL real asignada por Render (dashboard), no el
    # nombre "limpio" del servicio — Render le agrega un sufijo cuando
    # el nombre simple ya esta tomado por otro usuario (ver mas abajo
    # y docs/DECISIONES.md, incidente 2026-09-04).
    location = /v1/api/startups/create { proxy_pass https://create-startup-service-qwvp.onrender.com/; }
    location = /v1/api/startups/read   { proxy_pass https://read-startup-service-5wir.onrender.com/; }
    location /v1/api/startups/read/    { proxy_pass https://read-startup-service-5wir.onrender.com/; }
    location /v1/api/startups/update/  { proxy_pass https://update-startup-service-1vp2.onrender.com/; }
    location /v1/api/startups/delete/  { proxy_pass https://delete-startup-service-tghg.onrender.com/; }

    # --- Technologies ---
    location = /v1/api/technologies/create { proxy_pass https://create-technology-service-xrl2.onrender.com/; }
    location = /v1/api/technologies/read   { proxy_pass https://read-technology-service-ztgl.onrender.com/; }
    location /v1/api/technologies/read/    { proxy_pass https://read-technology-service-ztgl.onrender.com/; }
    location /v1/api/technologies/update/  { proxy_pass https://update-technology-service-kde8.onrender.com/; }
    location /v1/api/technologies/delete/  { proxy_pass https://delete-technology-service-4c41.onrender.com/; }

    # --- Auth ---
    location = /v1/api/auth/login { proxy_pass https://auth-service-t7vb.onrender.com/; }

    # --- Salud del propio gateway ---
    location = /status {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
