# gateway/nginx.conf
#
# Reverse proxy puro (brief seccion 3): no valida, no transforma el
# body, no toma decisiones de negocio — solo enruta por el prefijo
# /v1/api y hace strip de ese prefijo hacia cada microservicio. CORS
# se maneja en cada servicio FastAPI (shared/cors.py), no aqui —
# docs/DECISIONES.md explica por que.
#
# Nombres de upstream = nombres de servicio en docker-compose.yml,
# puerto interno 8000 (el que exponen los Dockerfile de cada
# microservicio, no el puerto publicado al host).
#
# Patron de strip de prefijo (brief seccion 7): "location =" para la
# ruta exacta (list/create, sin id), "location" con barra final como
# prefijo para las rutas que llevan id (read detalle, update, delete).

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;

    # Timeout 30s (brief seccion 7). proxy_buffering no se sobreescribe:
    # queda en su valor por defecto (on).
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # --- Startups ---
    location = /v1/api/startups/create { proxy_pass http://create-startup-service:8000/; }
    location = /v1/api/startups/read   { proxy_pass http://read-startup-service:8000/; }
    location /v1/api/startups/read/    { proxy_pass http://read-startup-service:8000/; }
    location /v1/api/startups/update/  { proxy_pass http://update-startup-service:8000/; }
    location /v1/api/startups/delete/  { proxy_pass http://delete-startup-service:8000/; }

    # --- Technologies ---
    location = /v1/api/technologies/create { proxy_pass http://create-technology-service:8000/; }
    location = /v1/api/technologies/read   { proxy_pass http://read-technology-service:8000/; }
    location /v1/api/technologies/read/    { proxy_pass http://read-technology-service:8000/; }
    location /v1/api/technologies/update/  { proxy_pass http://update-technology-service:8000/; }
    location /v1/api/technologies/delete/  { proxy_pass http://delete-technology-service:8000/; }

    # --- Auth ---
    location = /v1/api/auth/login { proxy_pass http://auth-service:8000/; }

    # --- Salud del propio gateway (brief seccion 6, opcional) ---
    # Servido directamente por nginx, sin proxy — no es un dato de
    # negocio, es el liveness check del gateway mismo.
    location = /status {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
