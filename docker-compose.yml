# RETO1 — docker-compose.yml
#
# Estado actual: db + los 8 microservicios CRUD (Startups y
# Technologies) + auth-service + gateway (nginx). Frontend se agrega en
# el paso siguiente.
#
# Los bloques x-* son anclas YAML: agrupan las variables de entorno que
# comparten varios servicios (conexion a DB, DB + JWT_SECRET para los
# protegidos, y FRONTEND_ORIGIN para CORS en los 9 microservicios) para
# no repetirlas servicio por servicio — mismo principio de "sin logica
# duplicada" que shared/, aplicado al compose.

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

x-db-env-protegido: &db-env-protegido
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Los scripts de db/init/ corren una sola vez, al crear el volumen
      # por primera vez (comportamiento estandar de la imagen oficial).
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-startup-service:
    build:
      context: .
      dockerfile: services/startups/create/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  read-startup-service:
    build:
      context: .
      dockerfile: services/startups/read/Dockerfile
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"

  update-startup-service:
    build:
      context: .
      dockerfile: services/startups/update/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8000"

  delete-startup-service:
    build:
      context: .
      dockerfile: services/startups/delete/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8004:8000"

  create-technology-service:
    build:
      context: .
      dockerfile: services/technologies/create/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8005:8000"

  read-technology-service:
    build:
      context: .
      dockerfile: services/technologies/read/Dockerfile
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8006:8000"

  update-technology-service:
    build:
      context: .
      dockerfile: services/technologies/update/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8007:8000"

  delete-technology-service:
    build:
      context: .
      dockerfile: services/technologies/delete/Dockerfile
    environment: *db-env-protegido
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8008:8000"

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    # Sin depends_on: db — auth-service no usa la base de datos.
    ports:
      - "8009:8000"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      - create-startup-service
      - read-startup-service
      - update-startup-service
      - delete-startup-service
      - create-technology-service
      - read-technology-service
      - update-technology-service
      - delete-technology-service
      - auth-service
    ports:
      - "8080:80"

volumes:
  db_data:
